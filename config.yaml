paths:
  raw_data_dir: data/raw
  vector_store_dir: vector_store
chunking:
  strategy: fixed
  unit: character
  chunk_size: 1000
  chunk_overlap: 150
embedding:
  model_name: BAAI/bge-small-en-v1.5
  batch_size: 32
  device: cpu
  query_prefix: "Represent this sentence for searching relevant passages: "
  local_files_only: true
retrieval:
  mode: dense
  top_k: 5
  hybrid_weight: 0.5
  candidate_k: 20
  rrf_k: 60
reranking:
  enabled: false
  model_name: BAAI/bge-reranker-base
  device: cpu
  batch_size: 8
  max_length: 512
  local_files_only: true
llm:
  base_url: http://localhost:11434
  model_name: qwen3:8b
  temperature: 0.0
  max_tokens: 512
  context_window: 4096
  timeout_seconds: 120
  think: false
  seed: 42
evaluation:
  dataset_path: eval/dataset/questions.jsonl
  results_dir: eval/results
  judge_model: null
  judge_attempts: 3
  judge_temperature: 0.0
web:
  api_url: http://127.0.0.1:8000
  request_timeout_seconds: 360
  health_timeout_seconds: 2
