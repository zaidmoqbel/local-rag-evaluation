[project]
name = "local-rag"
version = "0.1.0"
description = "Local document question answering with citations"
requires-python = ">=3.11,<3.14"
dependencies = [
    "chromadb>=1.0,<2",
    "fastapi>=0.115,<1",
    "filelock>=3,<4",
    "httpx>=0.27,<1",
    "markdown-it-py>=3,<5",
    "pydantic>=2,<3",
    "pymupdf>=1.24,<2",
    "pyyaml>=6,<7",
    "rank-bm25>=0.2.2,<0.3",
    "sentence-transformers>=5,<6",
    "streamlit>=1.42,<2",
    "torch>=2.6,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
